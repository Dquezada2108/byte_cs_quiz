<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Byte · IB Computer Science</title>
<meta name="description" content="Learn IB Computer Science Topic 1 (Data Representation) and Topic 2 (Data Transmission) with Byte, one bite-sized lesson at a time.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect x='10' y='14' width='100' height='84' rx='22' fill='%230f5468'/%3E%3Crect x='22' y='26' width='76' height='58' rx='12' fill='%23b9f0e6'/%3E%3Crect x='40' y='42' width='11' height='16' rx='5' fill='%230b2f3b'/%3E%3Crect x='69' y='42' width='11' height='16' rx='5' fill='%230b2f3b'/%3E%3Cpath d='M48 68 q12 10 24 0' stroke='%230b2f3b' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&family=JetBrains+Mono:wght@600;700&display=swap">
<style>
/* Layout: one narrow column — lesson path on the home screen, full-screen lesson with a bottom feedback sheet */
:root {
  --brand: #0f5468;        /* Byte's dark blue-teal */
  --brand-hi: #157591;
  --brand-shadow: #093847;
  --brand-soft: #dcefF2;
  --bg: #f2f7f8;
  --surface: #ffffff;
  --line: #d6e3e6;
  --line-strong: #bcd0d5;
  --ink: #0f2a33;
  --muted: #5a7480;
  --screen: #b9f0e6;       /* Byte's screen */
  --byte-ink: #0b2f3b;
  --cheek: #ff9bb0;
  --good: #2c9f4b;
  --good-soft: #ddf4e2;
  --good-shadow: #217a39;
  --bad: #db4249;
  --bad-soft: #fde3e3;
  --bad-shadow: #ab3036;
  --gold: #f2ab1c;
  --gold-soft: #fff1cf;
  --flame: #ff7b3a;
  --heart: #ef4f5f;
  --locked: #c9d6da;
  --locked-shadow: #aabcc2;
  --f-display: "Fredoka", "Nunito", system-ui, sans-serif;
  --f-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --brand: #1a7a95; --brand-hi: #2290af; --brand-shadow: #0d4a5c; --brand-soft: #143844;
    --bg: #0b1a20; --surface: #12262e; --line: #1f3a44; --line-strong: #2b4c57;
    --ink: #e2f0f3; --muted: #8aa7b1; --screen: #9fe6da; --byte-ink: #0b2f3b;
    --good: #43c066; --good-soft: #15361f; --good-shadow: #2a8a46;
    --bad: #f0646a; --bad-soft: #3a1b1d; --bad-shadow: #b84449;
    --gold-soft: #3a2f12; --locked: #2a3f47; --locked-shadow: #1c2f36;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --brand: #1a7a95; --brand-hi: #2290af; --brand-shadow: #0d4a5c; --brand-soft: #143844;
  --bg: #0b1a20; --surface: #12262e; --line: #1f3a44; --line-strong: #2b4c57;
  --ink: #e2f0f3; --muted: #8aa7b1; --screen: #9fe6da; --byte-ink: #0b2f3b;
  --good: #43c066; --good-soft: #15361f; --good-shadow: #2a8a46;
  --bad: #f0646a; --bad-soft: #3a1b1d; --bad-shadow: #b84449;
  --gold-soft: #3a2f12; --locked: #2a3f47; --locked-shadow: #1c2f36;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-weight: 700; font-size: 16px; line-height: 1.45;
  padding-top: env(safe-area-inset-top, 0px);
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--brand-hi); outline-offset: 2px; }
.col { width: 100%; max-width: 600px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
[hidden] { display: none !important; }

/* ---------- Chunky buttons ---------- */
.btn {
  border: none; border-radius: 16px; padding: 14px 22px; cursor: pointer;
  font-family: var(--f-body); font-weight: 900; font-size: 1rem; letter-spacing: .06em; text-transform: uppercase;
  background: var(--brand); color: #fff; box-shadow: 0 4px 0 var(--brand-shadow);
  transition: transform .06s, box-shadow .06s, background .15s;
}
.btn:hover { background: var(--brand-hi); }
.btn:active { transform: translateY(4px); box-shadow: 0 0 0 var(--brand-shadow); }
.btn:disabled { background: var(--locked); color: var(--muted); box-shadow: 0 4px 0 var(--locked-shadow); cursor: not-allowed; transform: none; }
.btn.good { background: var(--good); box-shadow: 0 4px 0 var(--good-shadow); }
.btn.bad { background: var(--bad); box-shadow: 0 4px 0 var(--bad-shadow); }
.btn.good:disabled, .btn.bad:disabled { background: var(--locked); color: var(--muted); box-shadow: 0 4px 0 var(--locked-shadow); }
.btn.ghost { background: transparent; color: var(--muted); box-shadow: none; border: 2px solid var(--line); }
.btn.ghost:hover { background: var(--surface); }
.btn.wide { width: 100%; }

/* ---------- Byte ---------- */
.byte { display: block; overflow: visible; }
.byte .b-body { fill: var(--brand); }
.byte .b-dark { fill: var(--brand-shadow); }
.byte .b-screen { fill: var(--screen); }
.byte .b-ink { fill: var(--byte-ink); }
.byte .b-stroke { stroke: var(--byte-ink); fill: none; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
.byte .b-cheek { fill: var(--cheek); opacity: .7; }
.byte .b-bulb { fill: var(--gold); }
.byte .b-led { fill: #5ef0a0; }
.byte .b-bob { animation: bob 3.2s ease-in-out infinite; transform-origin: 60px 110px; }
.byte .b-eyes { animation: blink 4.5s infinite; transform-origin: 60px 50px; }
.byte.happy .b-bob { animation: hop .55s ease-out 2; }
.byte.sad .b-bob { animation: shake .45s ease-in-out 1; }
.byte .b-bulb { animation: glow 2.4s ease-in-out infinite; }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
@keyframes blink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
@keyframes hop { 0%,100% { transform: translateY(0); } 40% { transform: translateY(-12px) rotate(-3deg); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-5px) rotate(-3deg); } 75% { transform: translateX(5px) rotate(3deg); } }
@keyframes glow { 0%,100% { opacity: 1; } 50% { opacity: .55; } }

/* ---------- Home ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  border-bottom: 2px solid var(--line);
}
.topbar .col { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; }
.logo { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-weight: 700; font-size: 1.5rem; color: var(--brand); }
:root[data-theme="dark"] .logo, .dark-logo { color: var(--ink); }
.logo svg { width: 38px; height: 38px; }
.stats { display: flex; gap: 14px; align-items: center; }
.stat { display: flex; align-items: center; gap: 5px; font-weight: 900; font-variant-numeric: tabular-nums; }
.stat svg { width: 24px; height: 24px; }
.stat.flame { color: var(--flame); }
.stat.flame.off { color: var(--muted); }
.stat.gem { color: var(--gold); }
.icon-btn { background: none; border: 2px solid var(--line); border-radius: 12px; width: 40px; height: 40px; display: grid; place-items: center; cursor: pointer; color: var(--muted); }
.icon-btn svg { width: 22px; height: 22px; }

.home { padding-block: 20px 60px; display: grid; gap: 22px; }
.hello { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 14px; align-items: center; }
.hello .byte { width: 96px; }
.bubble {
  position: relative; background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 12px 16px;
  font-weight: 700; min-width: 0;
}
.bubble::before {
  content: ""; position: absolute; left: -10px; top: 50%; width: 16px; height: 16px; margin-top: -8px;
  background: var(--surface); border-left: 2px solid var(--line); border-bottom: 2px solid var(--line); transform: rotate(45deg);
}
.bubble h1 { font-family: var(--f-display); font-size: 1.35rem; margin: 0 0 2px; font-weight: 600; text-wrap: balance; }
.bubble p { margin: 0; color: var(--muted); font-weight: 600; }

.goal { background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 14px 16px; display: grid; gap: 8px; }
.goal-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.goal-top b { font-family: var(--f-display); font-weight: 600; font-size: 1.05rem; }
.goal-top span { color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 16px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 99px; background: var(--gold); width: 0; transition: width .5s cubic-bezier(.3,1.4,.6,1); position: relative; }
.bar > i::after { content: ""; position: absolute; left: 8px; right: 8px; top: 3px; height: 4px; border-radius: 99px; background: rgba(255,255,255,.35); }

.unit { display: grid; gap: 18px; }
.unit-banner {
  background: var(--brand); color: #fff; border-radius: 16px; padding: 16px 18px;
  box-shadow: 0 4px 0 var(--brand-shadow); display: flex; justify-content: space-between; gap: 12px; align-items: center;
}
.unit-banner .k { font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; opacity: .8; font-weight: 800; }
.unit-banner h2 { font-family: var(--f-display); font-size: 1.35rem; margin: 2px 0 0; font-weight: 600; }
.unit-banner .count { font-family: var(--f-mono); font-size: .85rem; background: rgba(255,255,255,.15); border-radius: 10px; padding: 4px 9px; white-space: nowrap; }

.path { display: grid; justify-items: center; gap: 16px; padding-block: 6px 10px; }
.node-wrap { position: relative; display: grid; justify-items: center; }
.node {
  width: 76px; height: 70px; border-radius: 50%; border: none; cursor: pointer;
  background: var(--brand); box-shadow: 0 7px 0 var(--brand-shadow); display: grid; place-items: center; color: #fff;
  transition: transform .06s, box-shadow .06s;
}
.node:active { transform: translateY(7px); box-shadow: 0 0 0 var(--brand-shadow); }
.node svg { width: 34px; height: 34px; }
.node.done { background: var(--gold); box-shadow: 0 7px 0 #c4850c; }
.node.locked { background: var(--locked); box-shadow: 0 7px 0 var(--locked-shadow); color: var(--muted); cursor: not-allowed; }
.node.current { outline: 6px solid var(--brand-soft); outline-offset: 4px; }
.node-label { margin-top: 12px; font-size: .85rem; color: var(--muted); text-align: center; max-width: 160px; }
.start-tag {
  position: absolute; top: -40px; background: var(--surface); border: 2px solid var(--line); color: var(--brand);
  font-weight: 900; letter-spacing: .08em; font-size: .8rem; padding: 6px 12px; border-radius: 12px; white-space: nowrap;
  animation: float 1.6s ease-in-out infinite;
}
:root[data-theme="dark"] .start-tag { color: var(--ink); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .start-tag, :root:not([data-theme="light"]) .logo { color: var(--ink); } }
.start-tag::after { content: ""; position: absolute; left: 50%; bottom: -8px; width: 12px; height: 12px; margin-left: -6px; background: var(--surface); border-right: 2px solid var(--line); border-bottom: 2px solid var(--line); transform: rotate(45deg); }
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

.foot { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; color: var(--muted); font-size: .85rem; }
.foot button { background: none; border: none; color: var(--muted); text-decoration: underline; cursor: pointer; font-weight: 700; padding: 4px; }
.foot p { width: 100%; text-align: center; margin: 0; font-weight: 600; }

/* ---------- Lesson ---------- */
.lesson { min-height: 100%; display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: minmax(0, 1fr); }
.lesson-top { display: flex; align-items: center; gap: 14px; padding-block: 18px 8px; }
.lesson-top .bar { flex: 1; }
.lesson-top .bar > i { background: var(--good); }
.close { background: none; border: none; cursor: pointer; color: var(--muted); padding: 4px; display: grid; }
.close svg { width: 26px; height: 26px; }
.hearts { display: flex; align-items: center; gap: 4px; color: var(--heart); font-weight: 900; font-variant-numeric: tabular-nums; }
.hearts svg { width: 26px; height: 26px; }
.hearts.hit svg { animation: shake .4s; }

.q { padding-block: 18px 30px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; align-content: start; }
.q-kind { font-family: var(--f-display); font-weight: 600; font-size: 1.55rem; margin: 0; text-wrap: balance; }
.q-tag { font-size: .78rem; text-transform: uppercase; letter-spacing: .12em; color: var(--brand-hi); font-weight: 900; }
.prompt-row { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 12px; align-items: center; }
.prompt-row .byte { width: 88px; }
.prompt-row .bubble { font-size: 1.08rem; }
.big-value { font-family: var(--f-mono); font-size: 1.7rem; letter-spacing: .08em; color: var(--brand-hi); display: block; margin-top: 6px; }

.options { display: grid; gap: 10px; }
.opt {
  text-align: left; background: var(--surface); border: 2px solid var(--line); border-bottom-width: 5px; border-radius: 16px;
  padding: 14px 16px; cursor: pointer; display: flex; gap: 12px; align-items: center; font-weight: 700; font-size: 1.02rem;
}
.opt:hover { background: var(--brand-soft); }
.opt .key { flex: none; width: 28px; height: 28px; border: 2px solid var(--line); border-radius: 8px; display: grid; place-items: center; font-size: .8rem; color: var(--muted); }
.opt.sel { border-color: var(--brand-hi); background: var(--brand-soft); color: var(--ink); }
.opt.sel .key { border-color: var(--brand-hi); color: var(--brand-hi); }

.sentence { background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 18px; font-size: 1.15rem; line-height: 2.4; }
.slot {
  display: inline-flex; align-items: center; justify-content: center; min-width: 110px; height: 44px; vertical-align: middle;
  border-bottom: 3px solid var(--line-strong); margin: 0 4px; padding: 0 4px;
}
.slot .tile { margin: 0; }
.bank { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.tile {
  background: var(--surface); border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 12px; padding: 7px 14px;
  cursor: pointer; font-weight: 800; font-size: 1rem; line-height: 1.3;
}
.tile:hover { background: var(--brand-soft); }
.tile.used { visibility: hidden; }
.tile-ghost { background: var(--line); border-color: var(--line); color: transparent; cursor: default; }

.bits { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; max-width: 520px; width: 100%; margin: 0 auto; }
.bit-col { display: grid; gap: 6px; justify-items: stretch; text-align: center; }
.bit-col small { font-family: var(--f-mono); color: var(--muted); font-size: .72rem; }
.bit {
  aspect-ratio: 3 / 4; max-width: 100%; border-radius: 12px; border: 2px solid var(--line); border-bottom-width: 5px; background: var(--surface);
  font-family: var(--f-mono); font-weight: 700; font-size: clamp(1.2rem, 5vw, 1.8rem); cursor: pointer; color: var(--muted);
}
.bit.on { background: var(--brand); border-color: var(--brand-shadow); color: #fff; }
.bit.cursor { outline: 3px solid var(--gold); outline-offset: 2px; }
.bits-hint { text-align: center; color: var(--muted); font-size: .85rem; font-weight: 600; margin: 0; }

.num-row { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 6px 16px; }
.num-row:focus-within { border-color: var(--brand-hi); }
.num-row input { flex: 1; width: 0; min-width: 0; border: none; background: transparent; color: var(--ink); font-family: var(--f-mono); font-size: 1.5rem; padding: 10px 0; outline: none; }
.num-row .unit-lbl { color: var(--muted); font-weight: 800; }

.lesson-foot { border-top: 2px solid var(--line); padding-block: 18px calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--bg); }
.lesson-foot .col { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.lesson-foot .btn { min-width: 150px; }

.sheet { border-top: none; }
.sheet.good { background: var(--good-soft); }
.sheet.bad { background: var(--bad-soft); }
.sheet .col { display: grid; gap: 14px; }
.sheet-head { display: flex; align-items: center; gap: 12px; }
.sheet-head .badge { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); flex: none; }
.sheet-head .badge svg { width: 30px; height: 30px; }
.sheet.good .sheet-head { color: var(--good); }
.sheet.bad .sheet-head { color: var(--bad); }
.sheet-head h3 { font-family: var(--f-display); font-weight: 600; font-size: 1.45rem; margin: 0; }
.sheet-head p { margin: 0; font-weight: 800; }
.sheet .answer { font-weight: 800; color: var(--ink); }
.sheet .answer code { font-family: var(--f-mono); }
.sheet .expl { margin: 0; color: var(--ink); font-weight: 600; white-space: pre-line; max-width: 62ch; }
.sheet-enter { animation: slideUp .22s ease-out; }
@keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- Results ---------- */
.result { min-height: 100%; display: grid; place-items: center; padding-block: 30px; }
.result .col { display: grid; gap: 22px; justify-items: center; text-align: center; }
.result .byte { width: 160px; }
.result h2 { font-family: var(--f-display); font-weight: 600; font-size: 2rem; margin: 0; color: var(--gold); text-wrap: balance; }
.result h2.bad { color: var(--bad); }
.result p { margin: 0; color: var(--muted); font-weight: 700; max-width: 44ch; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; width: 100%; max-width: 440px; }
.tile-stat { border: 2px solid var(--gold); border-radius: 16px; overflow: hidden; background: var(--surface); }
.tile-stat .t { background: var(--gold); color: #fff; font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; font-weight: 900; padding: 4px; }
.tile-stat .v { font-family: var(--f-display); font-weight: 600; font-size: 1.45rem; padding: 10px 4px; font-variant-numeric: tabular-nums; }
.tile-stat.g { border-color: var(--good); } .tile-stat.g .t { background: var(--good); }
.tile-stat.b { border-color: var(--brand-hi); } .tile-stat.b .t { background: var(--brand-hi); }
.result .actions { display: grid; gap: 12px; width: 100%; max-width: 440px; }

.confirm-back { position: fixed; inset: 0; background: rgba(5, 20, 26, .55); display: grid; place-items: end center; z-index: 20; padding: 16px; }
.confirm { background: var(--surface); border-radius: 20px; padding: 22px; max-width: 420px; width: 100%; display: grid; gap: 14px; text-align: center; margin-bottom: env(safe-area-inset-bottom, 0px); }
.confirm .byte { width: 90px; margin: 0 auto; }
.confirm h3 { font-family: var(--f-display); font-weight: 600; margin: 0; font-size: 1.3rem; }
.confirm p { margin: 0; color: var(--muted); font-weight: 600; }

@media (max-width: 480px) {
  .prompt-row { grid-template-columns: 64px minmax(0, 1fr); }
  .prompt-row .byte { width: 64px; }
  .hello { grid-template-columns: 72px minmax(0, 1fr); }
  .hello .byte { width: 72px; }
  .lesson-foot .btn { min-width: 0; flex: 1; }
  .q-kind { font-size: 1.3rem; }
  .stats { gap: 10px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =====================================================================
   Content: IB Computer Science (Kognity)
     Topic 1 — Data Representation (units u1–u3)
     Topic 2 — Data Transmission (unit u4)
   Question types:
     mcq    – pick one option (answer = correct option text)
     blank  – fill the ___ gaps from a word bank
     bits   – set 8 bits
     number – type a number (accepted within [min, max])
   ===================================================================== */
const UNITS = [
  {
    id: "u1", title: "Number systems", tag: "Topic 1 · Unit 1",
    lessons: [
      {
        id: "u1l1", title: "Registers & two's complement",
        qs: [
          { type: "blank", text: "A ___ is a high-speed area of memory located within the CPU.",
            answers: ["register"], bank: ["register", "cache", "hard drive", "RAM"],
            expl: "A register is a small, ultra-high-speed area of memory within the CPU, used to temporarily store data during the fetch–decode–execute cycle." },
          { type: "blank", text: "The ___ number system is the human readable number system, which consists of 10 digits.",
            answers: ["denary"], bank: ["denary", "binary", "hexadecimal", "octal"],
            expl: "Denary (base 10) uses the digits 0–9, the system people use every day. Binary is base 2 and hexadecimal is base 16." },
          { type: "bits", prompt: "Convert this negative denary integer into 8-bit two's complement.", value: "−11", answer: "11110101",
            expl: "Start with positive denary 11, which is binary 00001011.\nThen complement it (flip every bit), giving 11110100.\nThen add 1, giving 11110101." },

/* ======================= Persistence ======================= */
const STORE = "byte-cs:v1";
const DAILY_GOAL = 30;
const defaultState = () => ({ xp: 0, done: {}, streak: { count: 0, last: null }, daily: { date: null, xp: 0 }, sound: true, unlockAll: false });
let S = defaultState();
try { const raw = JSON.parse(localStorage.getItem(STORE) || "null"); if (raw) S = Object.assign(defaultState(), raw); } catch (e) {}
const save = () => { try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) {} };

const dayKey = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const yesterdayKey = () => { const d = new Date(); d.setDate(d.getDate() - 1); return dayKey(d); };
const liveStreak = () => (S.streak.last === dayKey() || S.streak.last === yesterdayKey()) ? S.streak.count : 0;
const todayXP = () => (S.daily.date === dayKey() ? S.daily.xp : 0);

/* ======================= Sound effects ======================= */
let audioCtx = null;
function tone(freqs, type = "sine", dur = 0.12, gap = 0.09, vol = 0.12) {
  if (!S.sound) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach((f, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      const t = audioCtx.currentTime + i * gap;
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t + dur + 0.02);
    });
  } catch (e) {}
}
const sfx = {
  good: () => tone([660, 880], "triangle", 0.16, 0.1),
  bad: () => tone([220, 165], "square", 0.18, 0.12, 0.06),
  done: () => tone([523, 659, 784, 1047], "triangle", 0.2, 0.12)
};

/* ======================= Helpers ======================= */
const app = document.getElementById("app");
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const allLessons = UNITS.flatMap((u) => u.lessons);
const lessonIndex = (id) => allLessons.findIndex((l) => l.id === id);
const isUnlocked = (id) => S.unlockAll || lessonIndex(id) === 0 || !!S.done[allLessons[lessonIndex(id) - 1].id];
const currentLessonId = () => (allLessons.find((l) => !S.done[l.id]) || {}).id;

const CHEER = ["Bit by bit, you're getting there!", "That's a 1, not a 0. Nice!", "Byte-sized brilliance!", "Your registers are glowing!", "No overflow here. Great job!", "Correct! Saved to long-term memory."];
const OOPS = ["Not quite. Let's flip that bit.", "Close! Even good CPUs need a second cycle.", "Oops, that one overflowed.", "No worries, mistakes are how we debug."];
const KIND = {
  mcq: ["Choose the correct answer", "Multiple choice"],
  blank: ["Fill in the blank", "Word bank"],
  bits: ["Set the 8 bits", "Binary"],
  number: ["Type your answer", "Calculation"]
};

function askConfirm(title, text, okLabel, mood, onOk) {
  const back = document.createElement("div");
  back.className = "confirm-back";
  back.innerHTML = `<div class="confirm" role="dialog" aria-modal="true" aria-labelledby="cfT">
    ${byteSVG(mood)}<h3 id="cfT">${esc(title)}</h3><p>${esc(text)}</p>
    <button class="btn bad wide" id="cfOk">${esc(okLabel)}</button>
    <button class="btn ghost wide" id="cfNo">Cancel</button></div>`;
  document.body.appendChild(back);
  const close = () => { back.remove(); document.removeEventListener("keydown", onKey, true); };
  const onKey = (e) => { if (e.key === "Escape") { e.stopPropagation(); close(); } };
  document.addEventListener("keydown", onKey, true);
  back.addEventListener("click", (e) => { if (e.target === back) close(); });
  back.querySelector("#cfNo").addEventListener("click", close);
  back.querySelector("#cfOk").addEventListener("click", () => { close(); onOk(); });
  back.querySelector("#cfNo").focus();
}

/* ======================= Lesson engine ======================= */
let L = null;

function startLesson(lesson) {
  L = {
    lesson, queue: lesson.qs.map((_, i) => i), total: lesson.qs.length, done: 0, hearts: 5,
    missed: new Set(), start: Date.now(), cur: null, phase: "answer", input: null
  };
  nextQuestion();
}

function nextQuestion() {
  if (L.queue.length === 0) return finishLesson();
  L.cur = L.queue.shift();
  L.phase = "answer";
  renderQuestion();
}

function renderQuestion() {
  const q = L.lesson.qs[L.cur];
  const [kind, tag] = KIND[q.type];
  app.innerHTML = `
    <div class="lesson">
      <div class="col lesson-top">
        <button class="close" id="quit" aria-label="Quit lesson">${ICON.x}</button>
        <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${L.total}" aria-valuenow="${L.done}"><i style="width:${(L.done / L.total) * 100}%"></i></div>
        <span class="hearts" id="hearts" aria-label="${L.hearts} hearts left">${ICON.heart}${L.hearts}</span>
      </div>
      <main class="col q" id="q">
        <div><div class="q-tag">${tag}${L.missed.has(L.cur) ? " · Second try" : ""}</div><h2 class="q-kind">${kind}</h2></div>
        <div id="qBody"></div>
      </main>
      <div class="lesson-foot" id="foot">
        <div class="col">
          <button class="btn ghost" id="skip">Skip</button>
          <button class="btn good" id="check" disabled>Check</button>
        </div>
      </div>
    </div>`;

  document.getElementById("quit").addEventListener("click", quitLesson);
  document.getElementById("skip").addEventListener("click", () => grade(true));
  document.getElementById("check").addEventListener("click", () => grade(false));

  const body = document.getElementById("qBody");
  ({ mcq: buildMCQ, blank: buildBlank, bits: buildBits, number: buildNumber })[q.type](q, body);
}

const setReady = (ok) => { const c = document.getElementById("check"); if (c) c.disabled = !ok; };

function promptRow(q, extra = "") {
  return `<div class="prompt-row">${byteSVG("think")}<div class="bubble">${esc(q.prompt)}${extra}</div></div>`;
}

function buildMCQ(q, body) {
  const opts = shuffle(q.options);
  body.innerHTML = `${promptRow(q)}<div class="options" role="radiogroup" style="margin-top:22px">
    ${opts.map((o, i) => `<button class="opt" role="radio" aria-checked="false" data-v="${esc(o)}"><span class="key">${i + 1}</span><span>${esc(o)}</span></button>`).join("")}
  </div>`;
  L.input = null;
  body.querySelectorAll(".opt").forEach((b) => b.addEventListener("click", () => {
    if (L.phase !== "answer") return;
    body.querySelectorAll(".opt").forEach((x) => { x.classList.remove("sel"); x.setAttribute("aria-checked", "false"); });
    b.classList.add("sel"); b.setAttribute("aria-checked", "true");
    L.input = b.dataset.v; setReady(true);
  }));
}

function buildBlank(q, body) {
  const parts = q.text.split("___");
  const bank = shuffle(q.bank.map((w, i) => ({ w, id: i })));
  L.input = new Array(q.answers.length).fill(null);   // holds tile ids
  const draw = () => {
    let html = `<div class="prompt-row">${byteSVG("think")}<div class="bubble">Complete the sentence using the words below.</div></div>
      <div class="sentence" style="margin-top:22px">`;
    parts.forEach((p, i) => {
      html += esc(p);
      if (i < parts.length - 1) {
        const t = L.input[i];
        html += `<span class="slot" data-slot="${i}">${t != null ? `<button class="tile" data-back="${i}">${esc(bank.find((b) => b.id === t).w)}</button>` : ""}</span>`;
      }
    });
    html += `</div><div class="bank" style="margin-top:22px">${bank.map((b) =>
      `<button class="tile ${L.input.includes(b.id) ? "used" : ""}" data-tile="${b.id}" ${L.input.includes(b.id) ? 'tabindex="-1" aria-hidden="true"' : ""}>${esc(b.w)}</button>`).join("")}</div>`;
    body.innerHTML = html;
    body.querySelectorAll("[data-tile]").forEach((b) => b.addEventListener("click", () => {
      if (L.phase !== "answer") return;
      const slot = L.input.indexOf(null);
      if (slot === -1) return;
      L.input[slot] = +b.dataset.tile; draw();
    }));
    body.querySelectorAll("[data-back]").forEach((b) => b.addEventListener("click", () => {
      if (L.phase !== "answer") return;
      L.input[+b.dataset.back] = null; draw();
    }));
    setReady(!L.input.includes(null));
  };
  L.bankWords = (ids) => ids.map((id) => bank.find((b) => b.id === id).w);
  draw();
}

function buildBits(q, body) {
  L.input = { bits: [0, 0, 0, 0, 0, 0, 0, 0], cursor: 0, touched: false };
  const values = [128, 64, 32, 16, 8, 4, 2, 1];
  body.innerHTML = `${promptRow(q, `<span class="big-value">${esc(q.value)}</span>`)}
    <div style="margin-top:24px; display:grid; gap:10px">
      <div class="bits">${values.map((v, i) => `<div class="bit-col"><small>${v}</small><button class="bit" data-i="${i}" aria-label="Bit worth ${v}">0</button></div>`).join("")}</div>
      <p class="bits-hint">Tap a bit to flip it, or type 0 and 1 on your keyboard.</p>
    </div>`;
  const paint = () => body.querySelectorAll(".bit").forEach((b, i) => {
    const on = L.input.bits[i] === 1;
    b.textContent = on ? "1" : "0"; b.classList.toggle("on", on);
    b.classList.toggle("cursor", L.input.touched && i === L.input.cursor && L.input.typing);
    b.setAttribute("aria-pressed", on ? "true" : "false");
  });
  body.querySelectorAll(".bit").forEach((b) => b.addEventListener("click", () => {
    if (L.phase !== "answer") return;
    const i = +b.dataset.i; L.input.bits[i] ^= 1; L.input.touched = true; L.input.typing = false; L.input.cursor = (i + 1) % 8;
    paint(); setReady(true);
  }));
  L.bitsKey = (k) => {
    if (k === "0" || k === "1") {
      L.input.bits[L.input.cursor] = +k; L.input.touched = true; L.input.typing = true;
      L.input.cursor = Math.min(7, L.input.cursor + (L.input.cursor === 7 ? 0 : 1));
      paint(); setReady(true); return true;
    }
    if (k === "Backspace") { L.input.cursor = Math.max(0, L.input.cursor - 1); L.input.bits[L.input.cursor] = 0; L.input.typing = true; paint(); return true; }
    return false;
  };
  paint();
}

function buildNumber(q, body) {
  body.innerHTML = `${promptRow(q)}
    <label class="num-row" style="margin-top:22px">
      <input id="numIn" inputmode="decimal" autocomplete="off" placeholder="Your answer" aria-label="Your answer">
      ${q.unit ? `<span class="unit-lbl">${esc(q.unit)}</span>` : ""}
    </label>`;
  const inp = body.querySelector("#numIn");
  inp.addEventListener("input", () => { L.input = inp.value; setReady(inp.value.trim() !== ""); });
  setTimeout(() => inp.focus(), 30);
}

const parseNum = (s) => {
  const cleaned = String(s).replace(/,/g, "").replace(/[a-zA-Z\s]/g, "");
  return cleaned === "" ? NaN : Number(cleaned);
};

function grade(skipped) {
  if (L.phase !== "answer") return;
  const q = L.lesson.qs[L.cur];
  let ok = false, shown = "";
  if (!skipped) {
    if (q.type === "mcq") ok = L.input === q.answer;
    else if (q.type === "blank") ok = L.bankWords(L.input).every((w, i) => w.toLowerCase() === q.answers[i].toLowerCase());
    else if (q.type === "bits") ok = L.input.bits.join("") === q.answer;
    else if (q.type === "number") { const v = parseNum(L.input); ok = !isNaN(v) && v >= q.min - 1e-9 && v <= q.max + 1e-9; }
  }
  if (q.type === "mcq") shown = esc(q.answer);
  else if (q.type === "blank") shown = q.answers.map(esc).join(" · ");
  else if (q.type === "bits") shown = `<code>${q.answer}</code>`;
  else shown = `<code>${q.answer.toLocaleString("en-US")}</code>${q.unit ? " " + esc(q.unit) : ""}`;

  L.phase = "feedback";
  L.lastOk = ok;
  document.querySelectorAll(".opt, .tile, .bit, #numIn").forEach((el) => { el.disabled = true; });

  // Byte reacts
  const byteEl = document.querySelector(".prompt-row .byte");
  if (byteEl) byteEl.outerHTML = byteSVG(ok ? "happy" : "sad");

  if (ok) sfx.good(); else sfx.bad();
  if (!ok) {
    L.hearts = Math.max(0, L.hearts - 1);
    L.missed.add(L.cur);
    const h = document.getElementById("hearts");
    h.innerHTML = ICON.heart + L.hearts; h.classList.add("hit"); h.setAttribute("aria-label", `${L.hearts} hearts left`);
  }

  const foot = document.getElementById("foot");
  foot.className = `lesson-foot sheet sheet-enter ${ok ? "good" : "bad"}`;
  foot.innerHTML = `<div class="col" role="status">
    <div class="sheet-head">
      <span class="badge">${ok ? ICON.goodBadge : ICON.badBadge}</span>
      <div><h3>${ok ? pick(["Correct!", "Nice!", "Excellent!", "Awesome!"]) : skipped ? "Skipped" : "Not quite"}</h3>
      <p>${ok ? esc(pick(CHEER)) : esc(pick(OOPS))}</p></div>
    </div>
    ${ok ? "" : `<div class="answer">Correct answer: ${shown}</div>`}
    <p class="expl">${esc(q.expl)}</p>
    <button class="btn ${ok ? "good" : "bad"} wide" id="cont">Continue</button>
  </div>`;
  const cont = document.getElementById("cont");
  cont.addEventListener("click", advance);
  cont.focus({ preventScroll: true });
  foot.scrollIntoView({ block: "end", behavior: "smooth" });
}

function advance() {
  if (L.phase !== "feedback") return;
  if (L.lastOk) L.done++;
  else L.queue.push(L.cur);   // missed questions come back at the end
  if (L.hearts === 0) return failLesson();
  nextQuestion();
}

function quitLesson() {
  askConfirm("Leave this lesson?", "Byte will miss you. Your progress in this lesson won't be saved.", "Quit lesson", "sad", () => { L = null; renderHome(); });
}

function finishLesson() {
  const firstTry = L.total - L.missed.size;
  const acc = Math.round((firstTry / L.total) * 100);
  const xp = firstTry * 2 + 10 + (L.missed.size === 0 ? 5 : 0);
  const secs = Math.round((Date.now() - L.start) / 1000);
  const time = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, "0")}`;

  const prev = S.done[L.lesson.id];
  S.done[L.lesson.id] = { acc: Math.max(acc, prev ? prev.acc || 0 : 0) };
  S.xp += xp;
  const today = dayKey();
  if (S.daily.date !== today) S.daily = { date: today, xp: 0 };
  S.daily.xp += xp;
  if (S.streak.last !== today) {
    S.streak.count = S.streak.last === yesterdayKey() ? S.streak.count + 1 : 1;
    S.streak.last = today;
  }
  save();
  sfx.done();

  const nextL = allLessons[lessonIndex(L.lesson.id) + 1];
  app.innerHTML = `<main class="result"><div class="col">
    ${byteSVG("happy")}
    <h2>Lesson complete!</h2>
    <p>${acc === 100 ? "A perfect run. Not a single bit out of place!" : acc >= 70 ? "Great work. Byte is proud of you!" : "You made it through! Replay it later to lock it in."}</p>
    <div class="tiles">
      <div class="tile-stat"><div class="t">Total XP</div><div class="v">+${xp}</div></div>
      <div class="tile-stat g"><div class="t">Accuracy</div><div class="v">${acc}%</div></div>
      <div class="tile-stat b"><div class="t">Time</div><div class="v">${time}</div></div>
    </div>
    <div class="actions">
      ${nextL ? `<button class="btn wide" id="nextBtn">Next lesson</button>` : ""}
      <button class="btn ${nextL ? "ghost" : ""} wide" id="homeBtn">Back to path</button>
    </div>
  </div></main>`;
  const done = L; L = null;
  document.getElementById("homeBtn").addEventListener("click", renderHome);
  if (nextL) document.getElementById("nextBtn").addEventListener("click", () => startLesson(nextL));
  (document.getElementById("nextBtn") || document.getElementById("homeBtn")).focus();
}

function failLesson() {
  const lesson = L.lesson; L = null;
  app.innerHTML = `<main class="result"><div class="col">
    ${byteSVG("sad")}
    <h2 class="bad">Out of hearts</h2>
    <p>Every computer scientist debugs. Read the explanations again and give it another go.</p>
    <div class="actions">
      <button class="btn wide" id="retry">Try again</button>
      <button class="btn ghost wide" id="homeBtn">Back to path</button>
    </div>
  </div></main>`;
  document.getElementById("retry").addEventListener("click", () => startLesson(lesson));
  document.getElementById("homeBtn").addEventListener("click", renderHome);
  document.getElementById("retry").focus();
}

/* ======================= Keyboard ======================= */
document.addEventListener("keydown", (e) => {
  if (!L || document.querySelector(".confirm-back")) return;
  const q = L.lesson.qs[L.cur];
  if (e.key === "Enter") {
    if (L.phase === "answer") { const c = document.getElementById("check"); if (c && !c.disabled) { e.preventDefault(); grade(false); } }
    else { e.preventDefault(); advance(); }
    return;
  }
  if (L.phase !== "answer") return;
  if (q.type === "mcq" && /^[1-4]$/.test(e.key)) {
    const b = document.querySelectorAll(".opt")[+e.key - 1]; if (b) b.click();
  } else if (q.type === "bits" && L.bitsKey && L.bitsKey(e.key)) {
    e.preventDefault();
  }
});

renderHome();

/* Exposed for testing */
window.__byte = { UNITS, parseNum };
</script>
</body>
</html>
